# Pagina Rete di ELT_RTKBase: il registro di sistema non supera 100 MB e limita i messaggi a raffica
# (es. chip WiFi in errore: migliaia di righe al secondo che saturano CPU e SD e scaldano il Pi).
[Journal]
SystemMaxUse=100M
RateLimitIntervalSec=30s
RateLimitBurst=2000
# registro su disco ogni minuto: dopo un blocco improvviso restano gli ultimi istanti
SyncIntervalSec=1m
